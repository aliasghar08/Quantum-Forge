steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_IMAGE_URI', '-f', 'pipelines/reactions/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE_URI']
images:
  - '$_IMAGE_URI'
substitutions:
  _IMAGE_URI: 'us-central1-docker.pkg.dev/quantom-forge/quantom-forge-repo/quantum-forge-harvester:latest'
