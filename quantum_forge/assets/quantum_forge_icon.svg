<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00BFA5" />
    </linearGradient>
    <linearGradient id="tealArc" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00BFA5" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgObsidian)" stroke="#16243D" stroke-width="6" />

  
  <ellipse cx="256" cy="256" rx="184" ry="86" transform="rotate(-34 256 256)" fill="none" stroke="url(#cyanArc)" stroke-width="18" stroke-linecap="round" opacity="0.92" filter="url(#softGlow)" />

  
  <ellipse cx="256" cy="256" rx="184" ry="86" transform="rotate(34 256 256)" fill="none" stroke="url(#tealArc)" stroke-width="18" stroke-linecap="round" opacity="0.82" />

  
  <circle cx="114" cy="186" r="16" fill="#00E5FF" filter="url(#softGlow)" />
  <circle cx="398" cy="326" r="16" fill="#00BFA5" filter="url(#softGlow)" />
  <circle cx="392" cy="178" r="13" fill="#38BDF8" />
  <circle cx="120" cy="334" r="13" fill="#00BFA5" />

  
  <polyline points="74,260 162,260 188,224 216,326 254,168 288,306 314,244 344,260 438,260" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
</svg>